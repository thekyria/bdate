[project]
name = "bdate"
version = "0.1.0"
description = "date(1), but in Byzantine reckoning: Anno Mundi, indiction, Julian calendar, seasonal hours"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
bdate = "bdate:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
