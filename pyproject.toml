[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bdate"
version = "0.1.0"
description = "date(1), but in Byzantine reckoning: Anno Mundi, indiction, Julian calendar, seasonal hours"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
bdate = "bdate:main"

[tool.setuptools]
py-modules = ["bdate"]
