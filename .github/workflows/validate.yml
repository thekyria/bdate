name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Spelling and file style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # Settings: .codespellrc
      - name: Spelling (codespell)
        run: uvx codespell==2.4.3

      # Settings: .editorconfig and .editorconfig-checker.json
      - name: Line endings, final newlines, whitespace (editorconfig-checker)
        run: uvx --from editorconfig-checker==3.11.1 ec

  clock:
    name: Clock app (browser smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/clock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/clock/package-lock.json

      - name: Install Playwright
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check app files and run the smoke test
        run: npm test
