# The docs moved to https://bdate.app/docs/ (built on Vercel, see vercel.json).
# GitHub Pages now only redirects the old thekyria.github.io/bdate/ addresses.
name: Docs redirects

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**/*.md"
      - "scripts/write-redirects.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build redirects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Write redirect pages
        run: node scripts/write-redirects.mjs _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
