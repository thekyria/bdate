name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "js/src/**"
      - "scripts/write-version.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The clock imports the JS port; ship a copy of it with the site.
      - name: Copy JS port into the site
        run: cp js/src/bdate.js docs/clock/bdate.js

      # The footers of the docs and the clock show the deployed commit as the version.
      - name: Write version.json
        run: node scripts/write-version.mjs

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
