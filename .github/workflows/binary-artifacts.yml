name: Binary Artifacts

# Fails if any tracked file is binary (OSPS-QA-05.01 / OSPS-QA-05.02).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: No binary files in repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Allowed: the clock app's PNG icons and social image (the web app
      # manifest and link previews need PNGs), and the Gradle wrapper jar,
      # which the next step checks against Gradle's published checksums.
      # Keep this list in sync with the no-binary-files hook in
      # .pre-commit-config.yaml.
      - name: Reject tracked binary files
        run: |
          # git marks content it detects as binary with "i/-text".
          binaries=$(git ls-files --eol | awk '$1 == "i/-text" { sub(/^[^\t]*\t/, ""); print }' |
            grep -Ev '^(docs/clock/icons/[^/]+\.png|docs/clock/social-image\.png|android/gradle/wrapper/gradle-wrapper\.jar)$' || true)
          if [ -n "$binaries" ]; then
            echo "::error::Binary files are not allowed in this repository:"
            echo "$binaries"
            exit 1
          fi
          echo "No binary files tracked besides the allowed ones."

      - name: Gradle wrapper is an official release
        uses: gradle/actions/wrapper-validation@v6
