# Set up once with `pre-commit install`; CI runs the same checks
# (.github/workflows/gitleaks.yml and binary-artifacts.yml).
repos:
  # No binary files (OSPS-QA-05.01 / OSPS-QA-05.02). The exceptions match
  # .github/workflows/binary-artifacts.yml.
  - repo: local
    hooks:
      - id: no-binary-files
        name: forbid binary files
        language: fail
        entry: "Binary files are not allowed in this repository"
        types: [binary]
        exclude: ^(docs/clock/icons/[^/]+\.png|docs/clock/social-image\.png|android/gradle/wrapper/gradle-wrapper\.jar)$
