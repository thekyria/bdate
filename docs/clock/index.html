<style>
  /* Layout: one dial, noon at the top and midnight at the bottom, with the date

  :root {

    --bar-bg: #0c090e; --bar-fg: #cfc4d2; --bar-link: #ddb052;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141017; --ink: #eee7ef; --muted: #a798ab; --rule: #392e3f; --disc: #1c1620;
    --gold: #ddb052; --on-gold: #1a1208;

  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--font-body);
    display: flex;
    flex-direction: column;
  }
  main {
    position: relative;
    flex: 1;
    box-sizing: border-box;
    width: 100%;
    max-width: calc(34rem + 32px);
    margin: 0 auto;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));

    align-content: start;
    gap: 20px;
    justify-items: center;

  #dial { width: min(100%, 26rem); height: auto; display: block; }
  #dial text { font-family: var(--font-display); }
  .wedge-day { fill: var(--day-a); }
  .wedge-day.alt { fill: var(--day-b); }
  .wedge-night { fill: var(--night-a); }
  .wedge-night.alt { fill: var(--night-b); }
  .wedge-now { fill: var(--gold); }
  .num { font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  .num-day { fill: var(--day-fg); }
  .num-night { fill: var(--night-fg); }
  .num-now { fill: var(--on-gold); }
  .watch-arc { fill: none; stroke: var(--night-a); stroke-width: 10; }
  .watch-arc.alt { stroke: var(--night-b); }
  .watch-label { font-size: 11px; fill: var(--muted); letter-spacing: 0.04em; }
  .disc { fill: var(--disc); stroke: var(--rule); }
  .hand { stroke: var(--gold); stroke-width: 2.5; stroke-linecap: round; }
  .hand-tip { fill: var(--gold); }

  .c-label { font-size: 13px; fill: var(--muted); text-anchor: middle; font-family: var(--font-body) !important; }

  .horizon { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
  .horizon-label { font-size: 10px; fill: var(--muted); font-family: var(--font-body) !important; font-variant-numeric: tabular-nums; }

  .menu p { margin: 0; color: var(--muted); }

  /* Footer bar. */
  .site-footer {
    display: flex;
    flex-wrap: wrap;

    gap: 4px 10px;
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    font-size: 0.8rem;
    text-align: center;
    background: var(--bar-bg);

  }
  .site-footer a, .support summary { color: var(--bar-link); text-decoration: none; cursor: pointer; }
  .site-footer a:hover, .support summary:hover { text-decoration: underline; }
  .site-footer .sep { color: var(--bar-link); opacity: 0.6; }
  .support { position: relative; }

  .support summary::-webkit-details-marker { display: none; }
  .support-links {
    position: absolute;
    bottom: calc(100% + 8px);

    transform: translateX(-50%);

    padding: 10px 14px;

    border: 1px solid rgb(255 255 255 / 0.12);

  /* Embedded: the dial alone, as large as the frame allows. */
  .compact body { display: grid; place-items: center; }
  .compact main { display: block; max-width: none; padding: 0; }
  .compact #dial { width: min(100vw, 100vh); }
  .compact .full { display: none; }
</style>

<script type="module">
import { byzantine, periodBounds, ordinal, DEFAULT_LAT, DEFAULT_LON } from "./bdate.js";

const PLACES = {
  constantinople: { name: "Constantinople", lat: DEFAULT_LAT, lon: DEFAULT_LON, tz: "Europe/Istanbul" },
  thessaloniki: { name: "Thessaloniki", lat: 40.632, lon: 22.951, tz: "Europe/Athens" },
  athens: { name: "Athens", lat: 37.972, lon: 23.727, tz: "Europe/Athens" },
  trebizond: { name: "Trebizond", lat: 41.005, lon: 39.726, tz: "Europe/Istanbul" },
  nicaea: { name: "Nicaea", lat: 40.429, lon: 29.721, tz: "Europe/Istanbul" },
  antioch: { name: "Antioch", lat: 36.202, lon: 36.160, tz: "Europe/Istanbul" },
  jerusalem: { name: "Jerusalem", lat: 31.778, lon: 35.235, tz: "Asia/Jerusalem" },
  alexandria: { name: "Alexandria", lat: 31.200, lon: 29.918, tz: "Africa/Cairo" },
  ravenna: { name: "Ravenna", lat: 44.418, lon: 12.204, tz: "Europe/Rome" },
  rome: { name: "Rome", lat: 41.902, lon: 12.453, tz: "Europe/Rome" },
};

const GREEK = ["α", "β", "γ", "δ", "ε", "ϛ", "ζ", "η", "θ", "ι", "ια", "ιβ"].map((n) => n + "ʹ");
const WATCH = ["first", "second", "third", "fourth"];
const DAY = 86400000;
const SVG = "http://www.w3.org/2000/svg";

// ---------------------------------------------------------------- settings

const params = new URLSearchParams(location.search);
if (params.get("theme") === "dark" || params.get("theme") === "light") {
  document.documentElement.dataset.theme = params.get("theme");
}
const compact = params.get("compact") === "1";
if (compact) document.documentElement.classList.add("compact");

/** The place named by `q` (place=… or lat=…&lon=…), or null if it names none. */
function placeFrom(q) {
  const key = (q.get("place") || "").toLowerCase();
  if (PLACES[key]) return { key, ...PLACES[key] };
  const lat = parseFloat(q.get("lat"));
  const lon = parseFloat(q.get("lon"));
  if (Number.isFinite(lat) && Number.isFinite(lon)) {
    return { key: "custom", name: q.get("name") || `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`, lat, lon, tz: q.get("tz") || null };
  }
  return null;
}

// The last place picked is remembered in this browser, so the installed app
// opens where you left it. A place in the URL wins; embeds never use storage.
const STORE = "bclock-place";

function storedPlace() {
  if (compact) return null;
  try {
    return placeFrom(new URLSearchParams(localStorage.getItem(STORE) || ""));
  } catch {
    return null;
  }
}

function savePlace() {
  if (compact) return;
  const q = new URLSearchParams();
  if (place.key === "custom") {
    q.set("lat", place.lat.toFixed(3));
    q.set("lon", place.lon.toFixed(3));
    q.set("name", place.name);
    if (place.tz) q.set("tz", place.tz);
  } else {
    q.set("place", place.key);
  }
  try {
    localStorage.setItem(STORE, q.toString());
  } catch {
    /* storage blocked (private window, settings): the page works without it */
  }
}

let place = placeFrom(params) || storedPlace() || { key: "constantinople", ...PLACES.constantinople };

/** Minutes east of UTC for IANA zone `tz` at `date`; the viewer's own offset if unknown. */
function offsetMinutes(date, tz) {
  if (tz) {
    try {
      const name = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "longOffset" })
        .formatToParts(date)
        .find((p) => p.type === "timeZoneName").value; // "GMT+03:00" or "GMT"
      const m = name.match(/([+-])(\d{1,2}):?(\d{2})?/);
      return m ? (m[1] === "-" ? -1 : 1) * (Number(m[2]) * 60 + Number(m[3] || 0)) : 0;
    } catch {
      /* unknown zone: fall through */
    }
  }
  return -date.getTimezoneOffset();
}

function clockTime(date) {
  const opts = { hour: "2-digit", minute: "2-digit", hourCycle: "h23" };
  try {
    return date.toLocaleTimeString("en-GB", place.tz ? { ...opts, timeZone: place.tz } : opts);
  } catch {
    return date.toLocaleTimeString("en-GB", opts);
  }
}

// ---------------------------------------------------------------- drawing

function el(name, attrs, parent) {
  const node = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  parent?.appendChild(node);
  return node;
}

const pt = (a, r) => [r * Math.sin(a), -r * Math.cos(a)];

function sector(a0, a1, r0, r1) {
  const [x0, y0] = pt(a0, r1), [x1, y1] = pt(a1, r1);
  const [x2, y2] = pt(a1, r0), [x3, y3] = pt(a0, r0);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M${x0} ${y0}A${r1} ${r1} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${large} 0 ${x3} ${y3}Z`;
}

function arc(a0, a1, r) {
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`;
}

/** Counter-clockwise arc from a0 back to a1 (a0 > a1). */
function arcReverse(a0, a1, r) {
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `M${x0} ${y0}A${r} ${r} 0 ${a0 - a1 > Math.PI ? 1 : 0} 0 ${x1} ${y1}`;
}

const $ = (id) => document.getElementById(id);

/** The day containing `now`, or the day just before the night containing it, plus that night. */
function cycle(now) {
  const cur = periodBounds(now, place.lat, place.lon);
  if (!cur) return null;
  if (cur.period === "day") {
    const night = periodBounds(new Date(cur.end.getTime() + 1), place.lat, place.lon);
    return night && { day: cur, night };
  }
  const day = periodBounds(new Date(cur.start.getTime() - 1), place.lat, place.lon);
  return day && { day, night: cur };
}

function render() {
  const now = new Date();
  const b = byzantine(now, { lat: place.lat, lon: place.lon, tzOffset: offsetMinutes(now, place.tz) });
  const s = b.seasonal;
  const c = cycle(now);

  for (const id of ["wedges", "watches", "horizons", "hand"]) $(id).replaceChildren();

  if (c && s) {
    const noon = (c.day.start.getTime() + c.day.end.getTime()) / 2;
    const angle = (t) => ((t - noon) / DAY) * 2 * Math.PI;

    for (const [period, bounds] of [["day", c.day], ["night", c.night]]) {
      const t0 = bounds.start.getTime();
      const step = (bounds.end.getTime() - t0) / 12;
      for (let i = 0; i < 12; i++) {
        const a0 = angle(t0 + i * step), a1 = angle(t0 + (i + 1) * step);
        const isNow = s.period === period && s.hour === i + 1;
        const cls = isNow ? "wedge-now" : `wedge-${period}${i % 2 ? " alt" : ""}`;
        el("path", { d: sector(a0, a1, 110, 176), class: cls, stroke: "var(--bg)", "stroke-width": 1 }, $("wedges"));
        if (a1 - a0 < 0.13 && !isNow) continue; // too narrow to label (far north/south)
        const [x, y] = pt((a0 + a1) / 2, 143);
        const t = el("text", { x, y, class: `num ${isNow ? "num-now" : `num-${period}`}` }, $("wedges"));
        t.textContent = GREEK[i];
      }
      if (period === "night") {
        const wstep = (bounds.end.getTime() - t0) / 4;
        for (let w = 0; w < 4; w++) {
          const a0 = angle(t0 + w * wstep), a1 = angle(t0 + (w + 1) * wstep);
          el("path", { d: arc(a0 + 0.01, a1 - 0.01, 186), class: `watch-arc${w % 2 ? " alt" : ""}` }, $("watches"));
          // Label along the arc, flipped on the lower half so it reads left to right.
          const lower = Math.cos((a0 + a1) / 2) < 0;
          const id = `watch-path-${w}`;
          el("path", {
            id,
            d: lower ? arcReverse(a1, a0, 207) : arc(a0, a1, 197),
            fill: "none",
          }, $("watches"));
          const label = el("text", { class: "watch-label" }, $("watches"));
          const tp = el("textPath", { href: `#${id}`, startOffset: "50%", "text-anchor": "middle" }, label);
          tp.textContent = `${GREEK[w]} φυλακή`;
        }
      }
    }

    // Sunrise and sunset: a dashed horizon line, with the clock time just inside the disc.
    for (const t of [c.day.start, c.day.end]) {
      const a = angle(t.getTime());
      const [x0, y0] = pt(a, 98), [x1, y1] = pt(a, 196);
      el("line", { x1: x0, y1: y0, x2: x1, y2: y1, class: "horizon" }, $("horizons"));
      el("text", {
        x: x0 * 0.97,
        y: y0 - 6,
        class: "horizon-label",
        "text-anchor": x0 < 0 ? "start" : "end",
      }, $("horizons")).textContent = clockTime(t);
    }

    // The hand: a pointer on the ring, from the disc's edge to past the wedges.
    const a = angle(now.getTime());
    const [hx0, hy0] = pt(a, 100), [hx, hy] = pt(a, 180);
    el("line", { x1: hx0, y1: hy0, x2: hx, y2: hy, class: "hand" }, $("hand"));
    const [tx, ty] = pt(a, 182);
    el("circle", { cx: tx, cy: ty, r: 5, class: "hand-tip" }, $("hand"));

    $("c-num").textContent = GREEK[s.hour - 1];
    $("c-label").textContent = s.period === "day"
      ? `${ordinal(s.hour)} hour of the day`
      : `${ordinal(s.hour)} hour of the night`;
    $("r-hour").textContent = s.period === "day"
      ? `${ordinal(s.hour)} hour of the day`
      : `${ordinal(s.hour)} hour of the night, ${WATCH[s.watch - 1]} watch`;
  } else {
    el("circle", { r: 176, class: "wedge-night" }, $("wedges"));
    el("circle", { r: 110, class: "disc" }, $("wedges"));
    $("c-num").textContent = "—";
    $("c-label").textContent = "no sunrise or sunset today";
    $("r-hour").textContent = "The sun does not rise or set here today, so there are no seasonal hours.";
  }

  $("c-date").textContent = `${b.julian_day} ${b.month_name} ${b.anno_mundi}`;
  $("r-day").textContent = `${b.weekday}, ${b.julian_day} ${b.month_name}`;
  $("r-year").textContent = `${b.anno_mundi} Anno Mundi · indiction ${b.indiction}`;
  const jdate = `${b.julian_year}-${String(b.julian_month).padStart(2, "0")}-${String(b.julian_day).padStart(2, "0")}`;
  $("r-meta").textContent = `${place.name} · Julian ${jdate} · modern ${b.gregorian.slice(0, 10)} ${clockTime(now)}`;
}

// ---------------------------------------------------------------- controls

function embedUrl() {
  const url = new URL(location.href);
  url.search = "";
  url.hash = "";
  const q = new URLSearchParams({ compact: "1" });
  if (place.key === "custom") {
    q.set("lat", place.lat.toFixed(3));
    q.set("lon", place.lon.toFixed(3));
  } else {
    q.set("place", place.key);
  }
  url.search = q.toString();
  return url.toString();
}

function syncControls() {
  const select = $("place");
  if (place.key === "custom" && !select.querySelector('option[value="custom"]')) {
    select.append(new Option(place.name, "custom"));
  }
  select.value = place.key;
  savePlace();
  $("embed-code").textContent =
    `<iframe src="${embedUrl()}" width="320" height="320" style="border:0" title="Byzantine clock"></iframe>`;
  try {
    const q = new URLSearchParams(location.search);
    for (const k of ["place", "lat", "lon", "name", "tz"]) q.delete(k);
    if (place.key === "custom") {
      q.set("lat", place.lat.toFixed(3));
      q.set("lon", place.lon.toFixed(3));
    } else if (place.key !== "constantinople") {
      q.set("place", place.key);
    }
    const qs = q.toString();
    history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
  } catch {
    /* some frames refuse history changes; the page works without it */
  }
}

for (const [key, p] of Object.entries(PLACES)) $("place").append(new Option(p.name, key));

$("place").addEventListener("change", (e) => {
  const key = e.target.value;
  if (PLACES[key]) place = { key, ...PLACES[key] };
  syncControls();
  render();
});

$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) {
    $("status").textContent = "This browser can't share your location. Pick a place from the list instead.";
    return;
  }
  $("status").textContent = "Finding your location…";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude: lat, longitude: lon } = pos.coords;
      place = { key: "custom", name: "Your location", lat, lon, tz: null };
      $("place").querySelector('option[value="custom"]')?.remove();
      $("status").textContent = "";
      syncControls();
      render();
    },
    () => {
      $("status").textContent = "Location wasn't shared. Pick a place from the list instead.";
    },
  );
});

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("embed-code").textContent);
    $("copy-status").textContent = "Embed code copied.";
  } catch {
    const range = document.createRange();
    range.selectNodeContents($("embed-code"));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
    $("copy-status").textContent = "Embed code selected. Press Ctrl+C or ⌘C to copy it.";
  }
});

function setMenu(open) {
  $("menu").hidden = !open;
  $("menu-toggle").setAttribute("aria-expanded", String(open));
  if (!open) $("copy-status").textContent = "";
}
$("menu-toggle").addEventListener("click", () => setMenu($("menu").hidden));
document.addEventListener("click", (e) => {
  if (!$("menu").hidden && !e.target.closest("#menu, #menu-toggle")) setMenu(false);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("menu").hidden) {
    setMenu(false);
    $("menu-toggle").focus();
  }
});

syncControls();
render();
setInterval(render, 15000);
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && render());

// Lets the clock be installed as an app and work offline.
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
